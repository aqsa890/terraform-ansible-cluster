- name: Setup and configure worker nodes
  hosts: workers
  become: true

  vars_files:
    - vars.yml
    - ../secrets.yml

  pre_tasks:
    - name: Put SELinux in permissive mode (RedHat family)
      ansible.builtin.command: setenforce 0
      when: ansible_os_family == "RedHat"
      ignore_errors: true

    - name: Ensure web root directory exists
      ansible.builtin.file:
        path: /var/www/html
        state: directory
        mode: '0755'

  roles:
    - geerlingguy.nginx

  tasks:
    - name: Deploy custom web page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        mode: '0644'
        content: |
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>Worker Node: {{ inventory_hostname }}</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
                  .card { background: #1e293b; padding: 2.5rem; border-radius: 1rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); max-width: 500px; width: 90%; border: 1px solid #334155; }
                  h1 { color: #38bdf8; margin-top: 0; font-size: 1.75rem; }
                  .badge { display: inline-block; background: #0284c7; color: white; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 600; margin-bottom: 1.5rem; }
                  .info-row { display: flex; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px solid #334155; }
                  .label { color: #94a3b8; font-weight: 500; }
                  .val { color: #f1f5f9; font-weight: 600; }
                  .status { color: #4ade80; font-weight: bold; }
              </style>
          </head>
          <body>
              <div class="card">
                  <h1>🚀 Nginx is Running!</h1>
                  <span class="badge">Ansible Galaxy Role</span>
                  <div class="info-row"><span class="label">Node:</span><span class="val">{{ inventory_hostname }}</span></div>
                  <div class="info-row"><span class="label">Public IP:</span><span class="val">{{ ansible_host }}</span></div>
                  <div class="info-row"><span class="label">OS:</span><span class="val">{{ ansible_distribution }} {{ ansible_distribution_version }}</span></div>
                  <div class="info-row"><span class="label">Status:</span><span class="val status">● Active (Running)</span></div>
              </div>
          </body>
          </html>
    - name: Update package cache (Debian family only)
      apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Demonstrate loaded secrets
      ansible.builtin.debug:
        msg: "The loaded API key is {{ api_key | default('Not Found') }}"

    - name: Install basic tools using a loop
      package:
        name: "{{ item }}"
        state: present
      loop: "{{ tools }}"

    - name: Verify installed tools
      ansible.builtin.command: "which {{ item }}"
      loop: "{{ tools }}"
      register: tool_check
      changed_when: false

    - name: Display verification summary
      ansible.builtin.debug:
        msg: "✓ {{ item.item }} is available at {{ item.stdout }} on {{ inventory_hostname }}"
      loop: "{{ tool_check.results }}"
      loop_control:
        label: "{{ item.item }}"
